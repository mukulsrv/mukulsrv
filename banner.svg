<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Soft dark slate to midnight blue gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B12" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Text Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Universally available modern sans-serif for the main text */
      .text-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      /* Terminal font */
      .text-console { font-family: 'Consolas', 'Courier New', monospace; }
      
      /* Name Text Styling */
      .name-main { font-size: 48px; fill: #F8FAFC; text-anchor: middle; letter-spacing: 6px; }
      /* Split chromatic shadow effect, much softer than glitch */
      .name-shadow-cyan { font-size: 48px; fill: transparent; stroke: #38BDF8; stroke-width: 1.5px; text-anchor: middle; letter-spacing: 6px; opacity: 0.6; }
      .name-shadow-pink { font-size: 48px; fill: transparent; stroke: #F472B6; stroke-width: 1.5px; text-anchor: middle; letter-spacing: 6px; opacity: 0.6; }
      
      /* Subtext Graffiti Tag */
      .tag { font-family: 'Brush Script MT', 'Comic Sans MS', cursive; font-size: 38px; fill: #A78BFA; text-anchor: middle; transform: rotate(-5deg); }
      
      /* Body text */
      .console { font-size: 14px; fill: #94A3B8; }
      .prompt { fill: #38BDF8; font-weight: bold; }
      
      .scanline {
        fill: url(#scanlines);
        opacity: 0.12; /* Much softer scanlines */
      }
      
      /* CSS animations for text */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.2s step-end infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(-5deg); }
        50% { transform: translateY(-4px) rotate(-3deg); }
      }
      .tag {
        animation: float 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .breathe-text {
        animation: breathe 3s ease-in-out infinite;
      }
    </style>
    
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="10" height="4">
      <rect width="10" height="2" fill="#000" />
      <rect y="2" width="10" height="2" fill="none" />
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 0,4" dur="2.5s" repeatCount="indefinite"/>
    </pattern>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
      <!-- Slow panning grid for depth -->
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 40,40" dur="20s" repeatCount="indefinite" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="250" fill="url(#bg-grad)" rx="10" />
  <rect width="800" height="250" fill="url(#grid)" rx="10" />

  <!-- Terminal Header UI -->
  <rect x="0" y="0" width="800" height="30" fill="#0F172A" rx="10" />
  <!-- Hide bottom corners of header so it fits smoothly on background -->
  <rect x="0" y="20" width="800" height="10" fill="#0F172A" />
  
  <!-- Mac Window Dots -->
  <circle cx="20" cy="15" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="40" cy="15" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="60" cy="15" r="6" fill="#10B981" opacity="0.8" />
  
  <text x="400" y="19" class="text-console" font-size="12" fill="#64748B" text-anchor="middle">guest@mukul: ~</text>

  <!-- Console Text -->
  <text x="35" y="70" class="text-console console"><tspan class="prompt">~</tspan> ./initialize.sh<tspan class="cursor">_</tspan></text>
  <text x="35" y="90" class="text-console console" fill="#38BDF8" opacity="0.9">Loading identity protocols...</text>

  <!-- Centered Name Group -->
  <g transform="translate(0, 20)">
    <!-- Cyan Outline shadow offset slightly left -->
    <text x="398" y="140" class="text-base name-shadow-cyan">MUKUL SRIVASTAVA</text>
    <!-- Pink Outline shadow offset slightly right -->
    <text x="402" y="140" class="text-base name-shadow-pink">MUKUL SRIVASTAVA</text>
    <!-- Main white text with soft glow -->
    <text x="400" y="140" class="text-base name-main" filter="url(#glow)">MUKUL SRIVASTAVA</text>
  </g>

  <!-- Tag / Graffiti vibe -->
  <text x="630" y="180" class="tag" filter="url(#glow)">Creator</text>

  <!-- Stats / Info at bottom -->
  <line x1="35" y1="210" x2="765" y2="210" stroke="#1E293B" stroke-width="1.5" />
  
  <text x="35" y="233" class="text-console console">
    <tspan fill="#64748B">[ </tspan><tspan fill="#38BDF8">CSE @ TIET</tspan><tspan fill="#64748B"> ]</tspan>
  </text>
  
  <text x="765" y="233" class="text-console console breathe-text" fill="#10B981" text-anchor="end">STATUS: ONLINE</text>

  <!-- Soft scanlines overlay -->
  <rect width="800" height="250" class="scanline" rx="10" pointer-events="none" />
  
  <!-- Outer border -->
  <rect width="800" height="250" fill="none" stroke="#1E293B" stroke-width="2" rx="10" pointer-events="none" />
</svg>
